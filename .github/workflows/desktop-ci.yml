name: Desktop CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    defaults:
      run:
        working-directory: snipsnap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: snipsnap/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run package

      - name: Packaged Electron workflows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - name: Packaged Electron workflows (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test

      - name: Packaged Electron workflows (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test
